<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0f1117;
      --card:    #1a1d27;
      --border:  #2a2d3a;
      --accent:  #4f8ef7;
      --accent2: #7c6af7;
      --success: #34d399;
      --danger:  #f87171;
      --text:    #e8eaf0;
      --muted:   #7a7d8c;
      --warn:    #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 80px; }

    /* TOPO */
    .topo {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topo a { color: var(--muted); text-decoration: none; font-size: 13px; transition: color .2s; }
    .topo a:hover { color: var(--text); }
    .topo-titulo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topo-icone { font-size: 22px; }

    /* PROGRESSO */
    .progresso-bar-wrap { height: 3px; background: var(--border); }
    .progresso-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

    /* CONTEÚDO */
    .conteudo { max-width: 680px; margin: 0 auto; padding: 32px 20px 0; }

    /* PASSO */
    .passo-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; line-height: 1.7; font-size: 15px; }
    .passo-box h3 { font-family: 'Sora', sans-serif; }
    .passo-box p { margin-top: 10px; }
    .passo-box table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 14px; }
    .passo-box th, .passo-box td { border: 1px solid var(--border); padding: 8px; }
    .passo-box th { background: rgba(79,142,247,.15); }

    /* NAVEGAÇÃO PASSOS */
    .nav-passos { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
    .nav-passos button {
      flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; transition: opacity .2s;
    }
    .nav-passos button:disabled { opacity: .3; cursor: default; }
    .btn-anterior { background: var(--card); color: var(--text); border: 1px solid var(--border) !important; }
    .btn-proximo  { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .passo-contador { font-size: 13px; color: var(--muted); white-space: nowrap; }

    /* QUIZ */
    .quiz-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
    .quiz-titulo { font-family: 'Sora', sans-serif; font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .quiz-pergunta { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 20px; line-height: 1.5; }
    .quiz-opcoes { display: flex; flex-direction: column; gap: 10px; }
    .opcao-btn {
      background: rgba(255,255,255,.03); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 13px 16px; cursor: pointer; text-align: left;
      color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif;
      transition: border-color .2s, background .2s;
    }
    .opcao-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,142,247,.07); }
    .opcao-btn.correta  { border-color: var(--success) !important; background: rgba(52,211,153,.1) !important; }
    .opcao-btn.errada   { border-color: var(--danger)  !important; background: rgba(248,113,113,.1) !important; }
    .opcao-btn:disabled { cursor: default; }
    .feedback { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; }
    .feedback.ok  { background: rgba(52,211,153,.12); color: var(--success); display: block; }
    .feedback.err { background: rgba(248,113,113,.12); color: var(--danger);  display: block; }
    .btn-proxima-pergunta {
      margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;
      display: none; transition: opacity .2s;
    }
    .btn-proxima-pergunta:hover { opacity: .88; }
    .quiz-progresso { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    /* RESULTADO FINAL */
    .resultado-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 40px 28px; text-align: center;
    }
    .resultado-icone { font-size: 64px; margin-bottom: 16px; }
    .resultado-titulo { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .resultado-nota {
      font-family: 'Sora', sans-serif; font-size: 48px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 12px 0;
    }
    .resultado-detalhe { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .resultado-acoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-voltar-menu {
      padding: 12px 28px; border-radius: 10px; background: var(--card);
      border: 1px solid var(--border); color: var(--text); font-family: 'Sora', sans-serif;
      font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none;
      transition: border-color .2s;
    }
    .btn-voltar-menu:hover { border-color: var(--accent); }
    .btn-refazer {
      padding: 12px 28px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff; font-family: 'Sora', sans-serif;
      font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity .2s;
    }
    .btn-refazer:hover { opacity: .88; }

    /* LOADING / ERRO */
    .msg-centro { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }

    /* FASE LABEL */
    .fase-label {
      display: inline-block; font-size: 12px; padding: 4px 12px; border-radius: 99px;
      margin-bottom: 16px; font-weight: 600;
    }
    .fase-conteudo { background: rgba(79,142,247,.12); color: var(--accent); }
    .fase-quiz     { background: rgba(124,106,247,.12); color: #a78bfa; }
  </style>
  <script src="aulas.js"></script>
</head>
<body>

<!-- BARRA DE TOPO -->
<div class="topo">
  <a href="menu.html">← Voltar</a>
  <span class="topo-icone" id="topo-icone">📖</span>
  <span class="topo-titulo" id="topo-titulo">Carregando...</span>
</div>

<!-- BARRA DE PROGRESSO -->
<div class="progresso-bar-wrap">
  <div class="progresso-bar" id="barra-progresso" style="width:0%"></div>
</div>

<!-- ÁREA PRINCIPAL -->
<div class="conteudo" id="area-conteudo">
  <div class="msg-centro">⏳ Carregando aula...</div>
</div>

<script>
(function () {
  // ── Verificar login ──────────────────────────────────────
  var aluno = localStorage.getItem('aluno');
  if (!aluno) { location.href = 'index.html'; return; }

  // ── Ler id da URL ────────────────────────────────────────
  var params = new URLSearchParams(location.search);
  var aulaId = parseInt(params.get('id'), 10);

  // ── Encontrar aula ───────────────────────────────────────
  var aula = null;
  if (typeof AULAS !== 'undefined') {
    for (var i = 0; i < AULAS.length; i++) {
      if (AULAS[i].id === aulaId) { aula = AULAS[i]; break; }
    }
  }

  var area = document.getElementById('area-conteudo');

  if (!aula) {
    area.innerHTML = '<div class="msg-centro">❌ Aula não encontrada.<br><a href="menu.html" style="color:var(--accent);margin-top:12px;display:inline-block;">← Voltar ao menu</a></div>';
    return;
  }

  // ── Atualizar topo ───────────────────────────────────────
  document.title = aula.titulo + ' — Aula';
  document.getElementById('topo-icone').textContent = aula.icone || '📖';
  document.getElementById('topo-titulo').textContent = aula.titulo;

  // ── Estado ───────────────────────────────────────────────
  var passos   = aula.passos   || [];
  var perguntas = aula.perguntas || [];
  var totalEtapas = passos.length + perguntas.length;

  var passoAtual    = 0;
  var perguntaAtual = 0;
  var fase          = 'conteudo'; // 'conteudo' | 'quiz' | 'resultado'
  var acertos       = 0;
  var respondidas   = 0;

  function atualizarBarra() {
    var progresso = 0;
    if (fase === 'conteudo') {
      progresso = totalEtapas > 0 ? (passoAtual / totalEtapas) * 100 : 0;
    } else if (fase === 'quiz') {
      progresso = totalEtapas > 0 ? ((passos.length + perguntaAtual) / totalEtapas) * 100 : 100;
    } else {
      progresso = 100;
    }
    document.getElementById('barra-progresso').style.width = progresso + '%';
  }

  // ──────────────────────────────────────────────────────────
  // FASE 1: CONTEÚDO (passos)
  // ──────────────────────────────────────────────────────────
  function renderizarPasso() {
    fase = 'conteudo';
    atualizarBarra();

    var html = '<span class="fase-label fase-conteudo">📖 Conteúdo — Passo ' + (passoAtual + 1) + ' de ' + passos.length + '</span>';
    html += '<div class="passo-box">' + passos[passoAtual] + '</div>';
    html += '<div class="nav-passos">';
    html += '<button class="btn-anterior" id="btn-ant" ' + (passoAtual === 0 ? 'disabled' : '') + ' onclick="irPasso(-1)">← Anterior</button>';
    html += '<span class="passo-contador">' + (passoAtual + 1) + ' / ' + passos.length + '</span>';

    if (passoAtual < passos.length - 1) {
      html += '<button class="btn-proximo" onclick="irPasso(1)">Próximo →</button>';
    } else {
      if (perguntas.length > 0) {
        html += '<button class="btn-proximo" onclick="iniciarQuiz()">Iniciar Quiz →</button>';
      } else {
        html += '<button class="btn-proximo" onclick="concluirSemQuiz()">Concluir ✓</button>';
      }
    }
    html += '</div>';

    area.innerHTML = html;
  }

  window.irPasso = function (delta) {
    var novo = passoAtual + delta;
    if (novo < 0 || novo >= passos.length) return;
    passoAtual = novo;
    renderizarPasso();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.iniciarQuiz = function () {
    fase = 'quiz';
    perguntaAtual = 0;
    acertos = 0;
    respondidas = 0;
    renderizarPergunta();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.concluirSemQuiz = function () {
    salvarNota(10);
    renderizarResultado(10, 0, 0);
  };

  // ──────────────────────────────────────────────────────────
  // FASE 2: QUIZ
  // ──────────────────────────────────────────────────────────
  function renderizarPergunta() {
    atualizarBarra();
    var q = perguntas[perguntaAtual];

    var html = '<span class="fase-label fase-quiz">📝 Quiz — Pergunta ' + (perguntaAtual + 1) + ' de ' + perguntas.length + '</span>';
    html += '<div class="quiz-box">';
    html += '<div class="quiz-progresso">Pergunta ' + (perguntaAtual + 1) + ' de ' + perguntas.length + '</div>';
    html += '<div class="quiz-pergunta">' + q.pergunta + '</div>';
    html += '<div class="quiz-opcoes" id="opcoes">';
    q.opcoes.forEach(function (op, idx) {
      html += '<button class="opcao-btn" data-idx="' + idx + '" data-correta="' + (op.correta ? '1' : '0') + '" onclick="responder(this)">' + op.texto + '</button>';
    });
    html += '</div>';
    html += '<div class="feedback" id="feedback"></div>';
    html += '<button class="btn-proxima-pergunta" id="btn-prox-perg" onclick="proximaPergunta()">Próxima pergunta →</button>';
    html += '</div>';

    area.innerHTML = html;
  }

  window.responder = function (btn) {
    // Desabilitar todos os botões
    var todos = area.querySelectorAll('.opcao-btn');
    todos.forEach(function (b) { b.disabled = true; });

    var correta = btn.getAttribute('data-correta') === '1';
    var feedback = document.getElementById('feedback');
    var btnProx = document.getElementById('btn-prox-perg');

    if (correta) {
      btn.classList.add('correta');
      feedback.textContent = '✅ Correto! Muito bem!';
      feedback.className = 'feedback ok';
      acertos++;
    } else {
      btn.classList.add('errada');
      feedback.textContent = '❌ Errado. A resposta correta é: ';
      // Destacar a correta
      todos.forEach(function (b) {
        if (b.getAttribute('data-correta') === '1') {
          b.classList.add('correta');
          feedback.textContent += b.textContent;
        }
      });
      feedback.className = 'feedback err';
    }

    respondidas++;
    btnProx.style.display = 'block';

    // Último: mudar texto do botão
    if (perguntaAtual >= perguntas.length - 1) {
      btnProx.textContent = 'Ver resultado →';
    }
  };

  window.proximaPergunta = function () {
    perguntaAtual++;
    if (perguntaAtual >= perguntas.length) {
      // Calcular nota
      var nota = Math.round((acertos / perguntas.length) * 10 * 10) / 10;
      salvarNota(nota);
      renderizarResultado(nota, acertos, perguntas.length);
    } else {
      renderizarPergunta();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // ──────────────────────────────────────────────────────────
  // FASE 3: RESULTADO
  // ──────────────────────────────────────────────────────────
  function renderizarResultado(nota, acertos, total) {
    fase = 'resultado';
    atualizarBarra();

    var icone = nota >= 7 ? '🏆' : nota >= 5 ? '👍' : '💪';
    var msg   = nota >= 7 ? 'Excelente trabalho!' : nota >= 5 ? 'Bom trabalho!' : 'Continue praticando!';

    var detalhe = total > 0 ? 'Você acertou ' + acertos + ' de ' + total + ' perguntas.' : 'Aula concluída com sucesso!';

    var html = '<div class="resultado-box">';
    html += '<div class="resultado-icone">' + icone + '</div>';
    html += '<div class="resultado-titulo">' + msg + '</div>';
    html += '<div class="resultado-nota">' + nota + '/10</div>';
    html += '<div class="resultado-detalhe">' + detalhe + '</div>';
    html += '<div class="resultado-acoes">';
    html += '<a href="menu.html" class="btn-voltar-menu">← Menu de Aulas</a>';
    if (total > 0) {
      html += '<button class="btn-refazer" onclick="reiniciarAula()">🔄 Refazer Quiz</button>';
    }
    html += '</div>';
    html += '</div>';

    area.innerHTML = html;
  }

  window.reiniciarAula = function () {
    perguntaAtual = 0;
    acertos = 0;
    respondidas = 0;
    iniciarQuiz();
  };

  // ──────────────────────────────────────────────────────────
  // SALVAR NOTA NO SERVIDOR
  // ──────────────────────────────────────────────────────────
  function salvarNota(nota) {
    fetch('/salvar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome: aluno, aula: aula.titulo, nota: nota })
    }).catch(function () { /* silencioso */ });
  }

  // ── Iniciar ──────────────────────────────────────────────
  if (passos.length > 0) {
    renderizarPasso();
  } else if (perguntas.length > 0) {
    iniciarQuiz();
  } else {
    area.innerHTML = '<div class="msg-centro">⚠️ Esta aula não tem conteúdo ainda.<br><a href="menu.html" style="color:var(--accent);margin-top:12px;display:inline-block;">← Voltar ao menu</a></div>';
  }

})();
</script>
</body>
</html>
