<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Atividade</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
      --accent: #4f8ef7; --accent2: #7c6af7; --text: #e8eaf0;
      --muted: #7a7d8c; --success: #34d399; --danger: #f87171;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
           min-height: 100vh; padding: 24px 14px 60px; display: flex; flex-direction: column; align-items: center; }

    .topo { width: 100%; max-width: 560px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 18px; }
    .topo h1 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700;
               background: linear-gradient(135deg, var(--accent), var(--accent2));
               -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-back { font-size: 13px; color: var(--muted); background: var(--card);
                border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px;
                text-decoration: none; }

    .aluno-bar { width: 100%; max-width: 560px; background: var(--card);
                 border: 1px solid var(--border); border-radius: 10px;
                 padding: 10px 16px; margin-bottom: 16px; font-size: 13px;
                 display: flex; gap: 18px; flex-wrap: wrap; }
    .aluno-bar span { color: var(--muted); }

    .card { width: 100%; max-width: 560px; background: var(--card);
            border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 14px; }
    .card-titulo { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700;
                   margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
             font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 14px; }
    .badge.aberta  { background: rgba(52,211,153,.12); color: var(--success); border: 1px solid rgba(52,211,153,.3); }
    .badge.fechada { background: rgba(248,113,113,.12); color: var(--danger);  border: 1px solid rgba(248,113,113,.3); }
    .badge.enviada { background: rgba(79,142,247,.12);  color: var(--accent);  border: 1px solid rgba(79,142,247,.3); }

    .upload-box { border: 2px dashed var(--border); border-radius: 12px; padding: 32px 16px;
                  text-align: center; cursor: pointer; transition: border-color .2s;
                  margin-bottom: 14px; }
    .upload-box:hover { border-color: var(--accent); }
    .upload-box.selecionado { border-color: var(--success); background: rgba(52,211,153,.04); }
    .upload-box .ic { font-size: 38px; margin-bottom: 10px; display: block; }
    .upload-box p  { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .upload-box p strong { color: var(--text); }
    input[type=file] { display: none; }

    .arquivo-info { background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
                    padding: 10px 14px; font-size: 13px; display: flex; align-items: center;
                    gap: 10px; margin-bottom: 14px; }
    .arquivo-info .nome { flex: 1; word-break: break-all; }
    .arquivo-info .remover { background: none; border: none; color: var(--danger);
                              font-size: 18px; cursor: pointer; line-height: 1; padding: 0; }

    .btn-enviar { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2));
                  border: none; border-radius: 10px; color: #fff; font-family: 'Sora', sans-serif;
                  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
    .btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; }

    .msg { border-radius: 10px; padding: 14px; text-align: center; font-size: 13px;
           font-weight: 600; margin-top: 14px; line-height: 1.6; }
    .msg.ok  { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: var(--success); }
    .msg.err { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--danger); }

    .aviso-vazio { text-align: center; padding: 40px 0; color: var(--muted); }
    .aviso-vazio span { font-size: 40px; display: block; margin-bottom: 12px; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3);
               border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
               vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="topo">
  <h1>📎 Enviar Atividade</h1>
  <a class="btn-back" href="menu.html">← Voltar</a>
</div>

<div class="aluno-bar" id="aluno-bar">
  <span>Carregando...</span>
</div>

<div id="conteudo"></div>

<script>
const aluno = localStorage.getItem('aluno') || '';
const rm    = localStorage.getItem('rm')   || '';
const turma = localStorage.getItem('turma')|| '';

if (!aluno) { location.href = 'index.html'; }

// Preenche barra do aluno
document.getElementById('aluno-bar').innerHTML = `
  <span>👤 <strong>${aluno}</strong></span>
  <span>RM: <strong>${rm || '—'}</strong></span>
  <span>Turma: <strong>${turma || '—'}</strong></span>
`;

async function carregarJanelas() {
  const cont = document.getElementById('conteudo');
  cont.innerHTML = '<p style="color:var(--muted);text-align:center;padding:30px 0">Verificando atividades...</p>';
  try {
    const r = await fetch(`/atividade-hoje?turma=${encodeURIComponent(turma)}`);
    const janelas = await r.json();

    if (!janelas.length) {
      cont.innerHTML = `
        <div class="aviso-vazio">
          <span>📭</span>
          <strong>Nenhuma atividade liberada para hoje</strong>
          <p style="margin-top:8px;font-size:13px">O professor ainda não abriu o envio para sua turma.</p>
        </div>`;
      return;
    }

    cont.innerHTML = '';
    for (const j of janelas) {
      // Verifica se já enviou
      const sr = await fetch(`/atividade-status?janela_id=${j.id}&aluno=${encodeURIComponent(aluno)}`);
      const st = await sr.json();
      cont.appendChild(renderJanela(j, st));
    }
  } catch(e) {
    cont.innerHTML = `<p style="color:var(--danger);text-align:center">Erro ao carregar: ${e.message}</p>`;
  }
}

function renderJanela(janela, status) {
  const div = document.createElement('div');
  div.className = 'card';

  const jaEnviou = status.enviado;
  const badge = jaEnviou
    ? `<span class="badge enviada">✅ Enviado em ${status.envio.enviado_em}</span>`
    : `<span class="badge aberta">🟢 Envio aberto</span>`;

  div.innerHTML = `
    <div class="card-titulo">${janela.titulo}</div>
    ${janela.descricao ? `<div class="card-desc">${janela.descricao}</div>` : ''}
    ${badge}
    ${jaEnviou ? renderEnviado(status.envio) : renderForm(janela)}
  `;

  if (!jaEnviou) {
    bindForm(div, janela);
  }

  return div;
}

function renderEnviado(envio) {
  return `
    <div class="arquivo-info">
      <span>📄</span>
      <span class="nome">${envio.arquivo_nome}</span>
    </div>
    <p style="font-size:12px;color:var(--muted);text-align:center">
      Você já enviou esta atividade. Se precisar reenviar, entre em contato com o professor.
    </p>`;
}

function renderForm(janela) {
  return `
    <div class="upload-box" id="box-${janela.id}">
      <span class="ic">📁</span>
      <p><strong>Clique para selecionar o arquivo</strong></p>
      <p style="margin-top:6px;font-size:12px">PDF, Word (.doc/.docx) — máx. 20MB</p>
    </div>
    <input type="file" id="file-${janela.id}" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <div id="info-${janela.id}" style="display:none" class="arquivo-info">
      <span>📄</span>
      <span class="nome" id="nome-${janela.id}"></span>
      <button class="remover" id="rem-${janela.id}" title="Remover">✕</button>
    </div>
    <button class="btn-enviar" id="btn-${janela.id}" disabled>Enviar Atividade</button>
    <div id="msg-${janela.id}"></div>
  `;
}

function bindForm(div, janela) {
  const box  = div.querySelector(`#box-${janela.id}`);
  const inp  = div.querySelector(`#file-${janela.id}`);
  const info = div.querySelector(`#info-${janela.id}`);
  const nome = div.querySelector(`#nome-${janela.id}`);
  const rem  = div.querySelector(`#rem-${janela.id}`);
  const btn  = div.querySelector(`#btn-${janela.id}`);
  const msg  = div.querySelector(`#msg-${janela.id}`);

  box.addEventListener('click', () => inp.click());

  inp.addEventListener('change', () => {
    if (!inp.files[0]) return;
    const f = inp.files[0];
    nome.textContent = f.name;
    info.style.display = 'flex';
    box.style.display = 'none';
    btn.disabled = false;
  });

  rem.addEventListener('click', () => {
    inp.value = '';
    info.style.display = 'none';
    box.style.display = '';
    btn.disabled = true;
    msg.innerHTML = '';
  });

  btn.addEventListener('click', async () => {
    if (!inp.files[0]) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Enviando...';
    msg.innerHTML = '';

    const fd = new FormData();
    fd.append('arquivo',    inp.files[0]);
    fd.append('janela_id',  janela.id);
    fd.append('aluno_nome', aluno);
    fd.append('aluno_rm',   rm);
    fd.append('turma',      turma);

    try {
      const r  = await fetch('/atividade-enviar', { method: 'POST', body: fd });
      const rs = await r.json();
      if (rs.ok) {
        msg.className = 'msg ok';
        msg.textContent = '✅ Atividade enviada com sucesso!';
        setTimeout(() => carregarJanelas(), 1500);
      } else {
        throw new Error(rs.erro || 'Erro desconhecido');
      }
    } catch(e) {
      msg.className = 'msg err';
      msg.textContent = '❌ ' + e.message;
      btn.disabled = false;
      btn.textContent = 'Enviar Atividade';
    }
  });
}

carregarJanelas();
</script>
</body>
</html>
